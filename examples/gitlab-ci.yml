# Copy into .gitlab-ci.yml (or include it) to publish a GitLab Release on tag push
# using conventional-commit notes from relnote. Needs Python 3.11+ and git in the
# notes job image; set GIT_DEPTH: 0 so the previous tag is in the clone.
# Docs: https://loki-inu.github.io/relnote/ci.html

stages: [notes, release]

release_notes:
  stage: notes
  image: python:3.12
  variables:
    GIT_DEPTH: 0
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - curl -fsSL -o relnote https://github.com/loki-inu/relnote/releases/download/v0.3.2/relnote
    - chmod +x relnote
    - ./relnote --version
    - ./relnote --no-bots --output notes.md --quiet
  artifacts:
    paths: [notes.md]

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs:
    - job: release_notes
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: notes.md
