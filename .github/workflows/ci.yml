name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Help and notes through a pipe (cp1252 console)
        shell: pwsh
        run: |
          python -m relnote --help | Out-String | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "relnote --help failed" }
          python -m relnote --since v0.1.0 --max 5 > notes.md
          if ($LASTEXITCODE -ne 0) { throw "relnote failed" }
          Get-Content notes.md -Encoding utf8 | Select-Object -First 10
      - name: Encoding tests
        run: python -m unittest tests.test_encoding -v
