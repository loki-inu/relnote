name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Help and notes through a pipe (cp1252 console)
        shell: pwsh
        run: |
          python -m relnote --help | Out-String | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "relnote --help failed" }
          python -m relnote --since v0.1.0 --max 5 > notes.md
          if ($LASTEXITCODE -ne 0) { throw "relnote failed" }
          Get-Content notes.md -Encoding utf8 | Select-Object -First 10
      - name: Encoding tests
        run: python -m unittest tests.test_encoding -v
      - name: Probe pwsh
        shell: pwsh
        run: ./scripts/windows-probe.ps1 -Label pwsh
      - name: Probe Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/windows-probe.ps1 -Label winps
      - name: Probe gh-relnote and release.sh in Git Bash
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          set -x
          python scripts/build_zipapp.py
          which python python3 || true
          gh --version | head -1
          gh extension install loki-inu/gh-relnote || true
          t="$RUNNER_TEMP/probe-bash"; rm -rf "$t"; mkdir -p "$t"; cd "$t"
          git init -q -b main; git config user.name P; git config user.email p@example.com
          echo '{"version": "1.0.0"}' > package.json; git add .; git commit -qm "chore: init"; git tag v1.0.0
          git commit -q --allow-empty -m "feat: add café ✓ support"
          gh relnote || echo "gh relnote exit=$?"
          PYTHON=python gh relnote || echo "gh relnote PYTHON=python exit=$?"
          RELNOTE="python $GITHUB_WORKSPACE/dist/relnote.pyz" bash "$GITHUB_WORKSPACE/examples/release.sh" --bump-file package.json --dry-run || echo "release.sh exit=$?"
          RELNOTE="python $GITHUB_WORKSPACE/dist/relnote.pyz" bash "$GITHUB_WORKSPACE/examples/release.sh" --bump-file package.json || echo "release.sh exit=$?"
          git log --oneline -3; git tag; cat package.json; head -12 CHANGELOG.md || true
