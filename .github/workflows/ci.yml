name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Help and notes through a pipe (cp1252 console)
        shell: pwsh
        run: |
          python -m relnote --help | Out-String | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "relnote --help failed" }
          python -m relnote --since v0.1.0 --max 5 > notes.md
          if ($LASTEXITCODE -ne 0) { throw "relnote failed" }
          Get-Content notes.md -Encoding utf8 | Select-Object -First 10
      - name: Encoding and line-ending tests
        run: python -m unittest tests.test_encoding tests.test_newlines -v
      - name: PowerShell 7 commands from docs/windows.html
        shell: pwsh
        run: ./scripts/windows-check.ps1
      - name: Windows PowerShell 5.1 commands from docs/windows.html
        shell: powershell
        run: ./scripts/windows-check.ps1
      - name: Probe released 0.3.1 line endings (temporary)
        shell: pwsh
        continue-on-error: true
        run: |
          curl.exe -fsSL -o $env:RUNNER_TEMP\old.pyz https://github.com/loki-inu/relnote/releases/download/v0.3.1/relnote.pyz
          $t = Join-Path $env:RUNNER_TEMP "old"; New-Item -ItemType Directory $t | Out-Null
          git -C $t init -q -b main; git -C $t config user.name C; git -C $t config user.email c@example.com; git -C $t config core.autocrlf false
          git -C $t commit -q --allow-empty -m "chore: init"; git -C $t tag v1.0.0; git -C $t commit -q --allow-empty -m "feat: x"
          [IO.File]::WriteAllBytes("$t\CHANGELOG.md", [Text.Encoding]::UTF8.GetBytes("# Changelog`n`n## [v1.0.0] - 2026-01-01`n`n- first`n"))
          python $env:RUNNER_TEMP\old.pyz --repo $t --changelog "$t\CHANGELOG.md" --changelog-title v1.1.0 -q
          python $env:RUNNER_TEMP\old.pyz --repo $t --output "$t\notes.md" -q
          foreach ($f in "CHANGELOG.md","notes.md") { $b = [IO.File]::ReadAllBytes("$t\$f"); "0.3.1 $f CR bytes: " + ($b | Where-Object { $_ -eq 13 }).Count + " of " + ($b | Where-Object { $_ -eq 10 }).Count + " LF" }
