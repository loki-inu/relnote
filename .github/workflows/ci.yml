name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Help and notes through a pipe (cp1252 console)
        shell: pwsh
        run: |
          python -m relnote --help | Out-String | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "relnote --help failed" }
          python -m relnote --since v0.1.0 --max 5 > notes.md
          if ($LASTEXITCODE -ne 0) { throw "relnote failed" }
          Get-Content notes.md -Encoding utf8 | Select-Object -First 10
      - name: Encoding and line-ending tests
        run: python -m unittest tests.test_encoding tests.test_newlines -v
      - name: PowerShell 7 commands from docs/windows.html
        shell: pwsh
        run: ./scripts/windows-check.ps1
      - name: Windows PowerShell 5.1 commands from docs/windows.html
        shell: powershell
        run: ./scripts/windows-check.ps1

  action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No new commits (clean no-op)
        id: empty
        uses: ./
        with:
          since: HEAD
      - name: Commits since v0.3.0
        id: notes
        uses: ./
        with:
          since: v0.3.0
          max: "5"
      - name: Check outputs
        shell: bash
        env:
          EMPTY_HAS: ${{ steps.empty.outputs.has-changes }}
          EMPTY_NOTES: ${{ steps.empty.outputs.notes }}
          EMPTY_NEXT: ${{ steps.empty.outputs.next-version }}
          HAS: ${{ steps.notes.outputs.has-changes }}
          NOTES: ${{ steps.notes.outputs.notes }}
          NEXT: ${{ steps.notes.outputs.next-version }}
        run: |
          set -euo pipefail
          test "$EMPTY_HAS" = false
          test -z "$EMPTY_NOTES"
          test -z "$EMPTY_NEXT"
          test "$HAS" = true
          printf '%s\n' "$NOTES" | grep -q "What's changed"
          case "$NEXT" in v0.*) ;; *) echo "unexpected next-version: $NEXT"; exit 1 ;; esac
          echo "ok: has-changes=$HAS next-version=$NEXT"

